# This workflow automates the testing and building of the entire project
# It covers the Frontend (React/Vite) and the two Backend services (Posts and Users)
name: Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Build Frontend
        run: npm run build
        continue-on-error: true

  posts-backend-tests:
    name: Posts Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Posts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - name: Run Maven tests
        run: mvn clean test
        continue-on-error: true

  users-backend-tests:
    name: Users Service Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Users
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - name: Run Maven tests
        run: mvn clean test
        continue-on-error: true
